<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;background:#f7f6f2;color:#17171a;font-family:"IBM Plex Sans",sans-serif;-webkit-font-smoothing:antialiased}
  .c{box-sizing:border-box;width:1200px;height:630px;padding:72px 80px;display:flex;flex-direction:column;border:1px solid #e4e2db}
  .top{display:flex;align-items:center;gap:16px;font-weight:600;font-size:26px;letter-spacing:-.01em}
  .os{font-weight:600;font-size:16px;letter-spacing:.04em;padding:2px 8px;border:1.5px solid #d2cfc5;border-radius:6px;color:#47474d}
  h1{margin:auto 0 0;font-size:86px;line-height:1.02;font-weight:600;letter-spacing:-.035em}
  .bot{display:flex;justify-content:space-between;align-items:center;margin-top:48px;padding-top:28px;border-top:1px solid #d2cfc5}
  .cmd{white-space:nowrap;font-family:"IBM Plex Mono",monospace;font-size:24px;background:#17171a;color:#f7f6f2;padding:14px 22px;border-radius:12px}
  .cmd span{opacity:.5;margin-right:10px}
  .t{white-space:nowrap;font-family:"IBM Plex Mono",monospace;font-size:18px;color:#6b6b71}
</style></head>
<body><div class="c">
  <div class="top">
    <svg width="40" height="40" viewBox="0 0 32 32"><rect x="2" y="2" width="12.5" height="12.5" rx="2.5" fill="#17171a"/><rect x="17.5" y="2" width="12.5" height="12.5" rx="2.5" fill="#e04a2a"/><rect x="2" y="17.5" width="12.5" height="12.5" rx="2.5" fill="#17171a"/><rect x="17.5" y="17.5" width="12.5" height="12.5" rx="2.5" fill="#17171a"/></svg>
    <span>Agent Skills</span><span class="os">OS</span>
  </div>
  <h1>Write a skill once.<br>Load it into any agent.</h1>
  <div class="bot">
    <div class="cmd"><span>$</span>npm install universal-agent-skills</div>
    <div class="t">Claude · OpenAI · LangChain · Cursor</div>
  </div>
</div></body></html>
